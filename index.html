<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bubble Pick</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="hud"><span>Score <b id="score">0</b></span><span id="combo"></span><span>Time <b id="time">45</b></span></div>
<div id="field" aria-label="Game area"></div>
<div id="menu"><div class="panel">
<h1>Bubble Pick</h1>
<p id="msg">Pick as many bubbles as you can in 45 seconds. Small bubbles score more. Gold bubbles are worth 25.</p>
<p>Best: <b id="best">0</b></p>
<button id="go">Play</button>
</div></div>
<script src="script.js"></script>
</body>
</html>
